<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">

<head>
    <title>Register</title>
</head>

<body>
    <main class="mx-auto max-w-sm">
        <div class="card">
            <h2>Register an account</h2>
            <div class="alert alert-danger" th:if="${param.invalid}">Username must be 3+ characters and password 8+.</div>
            <div class="alert alert-danger" th:if="${param.taken}">That username is already taken.</div>
            <form class="space-y-4" th:action="@{/register}" method="POST">
                <div>
                    <input class="input peer" id="username" name="username" placeholder="Username" required
                        minlength="3" type="text">
                    <p class="mt-1 hidden text-sm text-red-700 peer-user-invalid:block">
                        Username must be at least 3 characters.
                    </p>
                </div>

                <div>
                    <input class="input peer" id="pass" name="password" placeholder="Password" required minlength="8"
                        type="password">
                    <p class="mt-1 hidden text-sm text-red-700 peer-user-invalid:block">
                        Password must be at least 8 characters.
                    </p>
                </div>

                <button class="btn btn-primary w-full" type="submit">Register</button>
            </form>
        </div>
    </main>
</body>

</html>
