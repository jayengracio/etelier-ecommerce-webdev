<!DOCTYPE html>

<html lang="en">

<head>
    <link rel="shortcut icon" type="image/png" href="/images/logo.png">
    <title>Register</title>
    <meta charset="utf-8">

    <link href="style.css" rel="stylesheet" type="text/css">
    <script src="code.js" type="text/javascript"></script>

    <!-- Bootstrap -->
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <!-- Font Awesome Icons -->
    <link crossorigin="anonymous" href="https://use.fontawesome.com/releases/v5.7.0/css/all.css"
        integrity="sha384-lZN37f5QGtY3VHgisS14W3ExzMWZxybE1SJSEsQp9S+oqd12jhcu+A56Ebc1zFSJ" rel="stylesheet">
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container-sm">
        <div class="login">
            <h2>Register an account</h2>
            <br>
            <div class="alert alert-danger" th:if="${param.invalid}">Username must be 3+ characters and password 8+.
            </div>
            <div class="alert alert-danger" th:if="${param.taken}">That username is already taken.</div>
            <form th:action="@{/register}" class="was-validated" method="POST">
                <div class="form-group">
                    <input class="form-control" id="username" name="username" placeholder="Username" required
                        minlength="3" type="text">
                    <div class="invalid-feedback">Username must be at least 3 characters.</div>
                </div>

                <div class="form-group">
                    <input class="form-control" id="pass" name="password" placeholder="Password" required minlength="8"
                        type="password">
                    <div class="invalid-feedback">Password must be at least 8 characters.</div>
                    <br>
                </div>

                <div class="log-btns text-center">
                    <button class="btn btn-success btn-block" type="submit">Register</button>
                </div>
            </form>
        </div>
    </div>

</body>

</html>
