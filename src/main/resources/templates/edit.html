<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">

<head>
    <title>Edit Product</title>
</head>

<body>
    <main class="mx-auto max-w-xl">
        <h1 th:text="'Details for: ' + ${product.name}">Details for: </h1>

        <div th:if="${param.invalid}" class="alert alert-danger">
            Check the values: details can't be empty (max 1000 characters), price and stock can't be negative, and price
            has at most 2 decimals.
        </div>

        <form class="card space-y-4" th:action="@{/edit/product}" method="POST">
            <input type="hidden" name="id" th:value="${product.id}">

            <dl class="grid grid-cols-2 gap-4 text-sm">
                <div>
                    <dt class="font-medium text-stone-500">ID</dt>
                    <dd th:text="${product.id}"></dd>
                </div>
                <div>
                    <dt class="font-medium text-stone-500">Type</dt>
                    <dd th:text="${product.type}"></dd>
                </div>
            </dl>

            <div>
                <label class="label" for="price">Price</label>
                <input class="input peer" id="price" name="price" placeholder="New price" type="number" step="0.01"
                    min="0" th:value="${product.price}" required>
                <p class="mt-1 hidden text-sm text-red-700 peer-user-invalid:block">
                    Price can't be negative and has at most 2 decimals.
                </p>
            </div>

            <div>
                <label class="label" for="details">Details</label>
                <input class="input peer" id="details" name="details" placeholder="New details" type="text"
                    maxlength="1000" th:value="${product.details}" required>
                <p class="mt-1 hidden text-sm text-red-700 peer-user-invalid:block">Details can't be empty.</p>
            </div>

            <div>
                <label class="label" for="stock">Stock</label>
                <input class="input peer" id="stock" name="stock" placeholder="New stock" type="number" min="0"
                    th:value="${product.stock}" required>
                <p class="mt-1 hidden text-sm text-red-700 peer-user-invalid:block">
                    Stock must be a whole number, 0 or more.
                </p>
            </div>

            <div class="flex gap-2">
                <button class="btn btn-primary" type="submit">Done</button>
                <a class="btn btn-secondary" href="/products">Go Back</a>
            </div>
        </form>
    </main>
</body>

</html>
