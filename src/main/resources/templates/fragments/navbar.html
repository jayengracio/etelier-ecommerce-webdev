<header class="sticky top-0 z-10 border-b border-stone-200 bg-white" th:fragment="navbar"
    xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <nav class="mx-auto flex max-w-6xl items-center gap-4 px-4 py-3">
        <a class="shrink-0" href="/">
            <img alt="Web Dev Shop home" class="size-10" src="/images/logo.svg">
        </a>
        <!--/* Each link is an icon plus a .tooltip span: the span is the link's name for screen
             readers and shows on hover/focus. See .nav-icon and .tooltip in app.css. */-->
        <ul class="flex items-center gap-1">
            <li>
                <a href="/">
                    Home
                </a>
            </li>

            <li>
                <a href="/products">
                    Products
                </a>
            </li>

            <li sec:authorize="hasRole('ADMIN')">
                <a href="/owners">
                    Admin
                </a>
            </li>
        </ul>
        <ul class="ml-auto flex items-center gap-1">
            <li>
                <a class="nav-icon group" href="/login">
                    <svg th:replace="~{fragments/icons :: user-circle}"></svg>
                    <span class="tooltip" sec:authorize="isAuthenticated()">Account</span>
                    <span class="tooltip" sec:authorize="!isAuthenticated()">Log in</span>
                </a>
            </li>

            <!--/* cartCount comes from MainController; pages rendered elsewhere (errors) don't have it. */-->
            <li sec:authorize="isAuthenticated()" th:with="count=${cartCount ?: 0}">
                <a class="nav-icon group" href="/cart">
                    <svg th:replace="~{fragments/icons :: shopping-cart}"></svg>
                    <!--/* The number is for the eye (aria-hidden); screen readers get "Cart, 3 items" from the
                         label below. code.js (showCartCount) updates both after an add. */-->
                    <span id="cart-count" aria-hidden="true" th:text="${count}" th:hidden="${count == 0}"
                        class="absolute -top-1 -right-1 flex h-5 min-w-5 items-center justify-center rounded-full bg-emerald-600 px-1 text-xs font-semibold text-white tabular-nums ring-2 ring-white"></span>
                    <span class="tooltip">Cart<span id="cart-count-label" class="sr-only"
                            th:text="${count == 1} ? ', 1 item' : |, ${count} items|"></span></span>
                </a>
            </li>
        </ul>
    </nav>
</header>
