<header class="sticky top-0 z-10 border-b border-stone-200 bg-white" th:fragment="navbar"
    xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <nav class="mx-auto flex max-w-6xl items-center gap-6 px-4 py-3">
        <a class="shrink-0" href="/">
            <img alt="Home" class="size-10" src="/images/logo.svg">
        </a>
        <ul class="flex flex-wrap items-center gap-x-5 gap-y-1 text-sm font-medium">
            <li>
                <a class="hover:text-emerald-700" href="/">Home</a>
            </li>

            <li>
                <a class="hover:text-emerald-700" href="/products">Products</a>
            </li>

            <li sec:authorize="hasRole('ADMIN')">
                <a class="hover:text-emerald-700" href="/owners">Admin</a>
            </li>
        </ul>
        <ul class="ml-auto flex items-center gap-5">
            <li>
                <a aria-label="Account" class="hover:text-emerald-700" href="/login"><i class="fas fa-user"></i></a>
            </li>

            <li sec:authorize="isAuthenticated()">
                <a aria-label="Cart" class="hover:text-emerald-700" href="/cart"><i class="fas fa-shopping-cart"></i></a>
            </li>
        </ul>
    </nav>
</header>
