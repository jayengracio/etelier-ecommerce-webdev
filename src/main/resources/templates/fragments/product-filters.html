<!--/* The top of both products pages: the title with a live count, a name search, one chip per type
       ("types" from MainController) and the frame shown when nothing matches. code.js's
       filterProducts() does the filtering on the data-type and data-name of each product; a chip's
       aria-pressed says which type is chosen (and colours it, .chip).
       A th:block, so its parts become separate children of the page's flex <main> and get its gap. */-->
<th:block th:fragment="filters" xmlns:th="http://www.thymeleaf.org">
    <div class="flex flex-wrap items-end justify-between gap-x-6 gap-y-4">
        <div class="flex items-baseline gap-4">
            <h1 class="mb-0">Products</h1>
            <span class="text-caption text-zinc-500">
                <span id="product-count" class="whitespace-nowrap" aria-live="polite"
                    th:text="${#lists.size(products) == 1} ? '1 product' : |${#lists.size(products)} products|"></span>
                <span th:if="${hiddenCount}" class="whitespace-nowrap" th:text="|· ${hiddenCount} hidden|"></span>
            </span>
        </div>
        <div class="w-full sm:w-90">
            <label class="sr-only" for="searchName">Search products by name</label>
            <input class="input" id="searchName" oninput="filterProducts()" placeholder="Search by name..."
                type="search">
        </div>
    </div>

    <!--/* Phones: one row that scrolls sideways instead of wrapping into many rows. -mx-6 + px-6
           take it to the screen edges (the layout's gutter is px-6); py-1 leaves room for the focus
           ring, which the scroll box would otherwise cut off. No scrollbar (as in the mockup): the chip
           cut off at the edge shows there is more. */-->
    <div class="flex gap-2 max-sm:-mx-6 max-sm:overflow-x-auto max-sm:px-6 max-sm:py-1 max-sm:[scrollbar-width:none] sm:flex-wrap" role="group"
        aria-label="Filter by type">
        <button class="chip" type="button" data-type-filter="" aria-pressed="true">All</button>
        <button th:each="type : ${types}" class="chip" type="button" th:data-type-filter="${type}"
            aria-pressed="false" th:text="${type}"></button>
    </div>

    <div id="no-products"
        class="flex flex-col items-center justify-center gap-3 rounded-xl border-2 border-dashed border-zinc-300 px-6 py-16 text-center"
        hidden>
        <p class="font-display text-heading-lg">No products match your search.</p>
        <!--/* What was searched, e.g. "lamp" in furniture (code.js). */-->
        <p id="no-products-detail" class="text-caption text-zinc-500"></p>
    </div>
</th:block>
