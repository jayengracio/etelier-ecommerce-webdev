<!DOCTYPE html>
<!--/* The page frame every template uses: head, navbar, the page's <main>, footer.
       A page passes in its own <title> and <main>:
       <html th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}"> */-->
<html lang="en" th:fragment="layout(title, content)" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title th:replace="${title}">Etelier</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}">

    <!--/* code.js reads these for its POSTs. th:if: if a request ever has no token, skip them instead of failing the page. */-->
    <meta name="_csrf" th:if="${_csrf}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf}" th:content="${_csrf.headerName}">

    <link th:href="@{/app.css}" rel="stylesheet">
    <script th:src="@{/code.js}"></script>
</head>

<!--/* pb-20: room for the details page's bar of buttons, which is pinned to the bottom on phones. */-->
<body class="flex min-h-screen flex-col max-md:has-[#product-actions]:pb-20">
    <header th:replace="~{fragments/navbar :: navbar}"></header>
    <div class="mx-auto w-full max-w-6xl flex-1 px-6 py-16">
        <main th:replace="${content}"></main>
    </div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <div th:replace="~{fragments/cart-toast :: toast}"></div>
</body>

</html>
