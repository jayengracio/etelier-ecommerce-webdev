<!--/* One product in a grid: the products page and the home page's Featured row. The page needs
       lowStockThreshold in its model. data-type and data-name are what filterProducts() in code.js
       searches on the products page.
       Use it with <th:block th:each="product : ${products}"><li th:replace="~{fragments/product-card :: card(${product})}"></li></th:block>.

       Hover (or Tab into a card): it grows a little and gets the soft L3 shadow, as if picked up.
       Only scale, no upward move: a card that moved away from the pointer would lose its hover and
       drop back, flickering. motion-safe: no growing for people who turn off animations; they
       still get the shadow. */-->
<li th:fragment="card(product)"
    class="flex flex-col overflow-hidden rounded-xl border-2 border-zinc-300 bg-white transition duration-200 ease-out hover:border-transparent hover:shadow-lift has-focus-visible:border-transparent has-focus-visible:shadow-lift motion-safe:hover:scale-103 motion-safe:has-focus-visible:scale-103"
    th:data-type="${product.type}" th:data-name="${product.name}" xmlns:th="http://www.thymeleaf.org">
    <!--/* The picture is a second link to the details page, for mouse and touch. Tab and
           screen readers skip it, so they only meet the name link. */-->
    <a class="block border-b-2 border-zinc-300" th:href="@{/details/{id}(id=${product.id})}" tabindex="-1"
        aria-hidden="true">
        <div th:replace="~{fragments/product-picture :: picture(${product}, 'aspect-4/3 w-full', 'size-12')}"></div>
    </a>

    <!--/* flex-1 here + mt-auto on the buttons: they line up at the bottom of each row of cards. */-->
    <div class="flex flex-1 flex-col gap-1.5 p-4">
        <span class="text-eyebrow text-zinc-500 uppercase" th:text="${product.type}"></span>
        <h2 class="mb-0 text-heading-md">
            <a class="hover:underline hover:underline-offset-3" th:href="@{/details/{id}(id=${product.id})}"
                th:text="${product.name}"></a>
        </h2>
        <p class="font-strong tabular-nums"
            th:text="'€' + ${#numbers.formatDecimal(product.price, 1, 'COMMA', 2, 'POINT')}"></p>
        <p th:if="${product.stock == 0}"><span class="badge badge-danger">Out of stock</span></p>
        <p th:if="${product.stock > 0 and product.stock <= lowStockThreshold}">
            <span class="badge badge-warning" th:text="|Only ${product.stock} left|"></span>
        </p>

        <!--/* Two forms: Add To Cart stays on the page (code.js sends it and shows the toast);
               Buy is a normal post that ends on the checkout page. flex-auto: each grows from
               its own text width, so "Add To Cart" never gets squeezed on narrow cards. */-->
        <div class="mt-auto flex gap-2 pt-2.5">
            <form class="flex-auto" th:action="@{/cart/add/{id}(id=${product.id})}" method="post" data-add-to-cart
                th:data-name="${product.name}" th:data-image="${product.image} ? @{${product.image}}">
                <button class="btn btn-sm btn-outline w-full" type="submit"
                    th:disabled="${product.stock == 0}">Add To Cart</button>
            </form>
            <form class="flex-auto" th:action="@{/cart/buy/{id}(id=${product.id})}" method="post">
                <button class="btn btn-sm btn-primary w-full" type="submit"
                    th:disabled="${product.stock == 0}">Buy</button>
            </form>
        </div>
    </div>
</li>
