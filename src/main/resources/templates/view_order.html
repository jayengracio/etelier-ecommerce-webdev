<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">

<head>
    <title>View Orders</title>
</head>

<body>
    <main>
        <h1>Orders</h1>

        <nav th:if="${orders.totalPages > 1}" aria-label="Pages" class="mb-4 flex flex-wrap items-center gap-3 text-sm">
            <a th:if="${orders.hasPrevious()}" class="btn btn-sm btn-outline"
                th:href="@{/view/orders(status=${status}, page=${orders.number - 1}, size=${orders.size})}">&laquo;
                Previous</a>
            <span th:text="|Page ${orders.number + 1} of ${orders.totalPages} · ${orders.totalElements} orders|"></span>
            <a th:if="${orders.hasNext()}" class="btn btn-sm btn-outline"
                th:href="@{/view/orders(status=${status}, page=${orders.number + 1}, size=${orders.size})}">Next
                &raquo;</a>
        </nav>

        <!--/* Full class names in both branches, so Tailwind finds them in this file. */-->
        <div class="mb-4 flex flex-wrap gap-2">
            <a th:href="@{/view/orders}" class="btn btn-sm"
                th:classappend="${status == null} ? 'btn-primary' : 'btn-outline'">All</a>
            <a th:each="s : ${statuses}" th:href="@{/view/orders(status=${s})}" th:text="${s}" class="btn btn-sm"
                th:classappend="${s == status} ? 'btn-primary' : 'btn-outline'"></a>
        </div>

        <p class="text-stone-500" th:if="${orders.empty}">No orders here.</p>

        <div class="card overflow-x-auto p-0" th:unless="${orders.empty}">
            <table class="data-table" id="userTable">
                <thead>
                    <tr>
                        <th>Order</th>
                        <th>Customer</th>
                        <th>Date</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th><span class="sr-only">Actions</span></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${orders}">
                        <td th:text="${order.id}"></td>
                        <td th:text="${order.user.username}"></td>
                        <td class="whitespace-nowrap"
                            th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy, HH:mm')}"></td>
                        <td th:text="'€' + ${#numbers.formatDecimal(order.total, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td th:text="${order.status}"></td>
                        <td class="text-right">
                            <a class="btn btn-secondary btn-sm" th:href="@{/orders/{id}(id=${order.id})}">View</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>

</html>
