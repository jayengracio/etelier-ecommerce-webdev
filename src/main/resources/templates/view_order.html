<!DOCTYPE html>

<html lang="en">

<head>
    <link rel="shortcut icon" type="image/png" href="/images/logo.png">
    <title>View Orders</title>
    <meta charset="utf-8">

    <link href="/style.css" rel="stylesheet" type="text/css">
    <script src="/code.js" type="text/javascript"></script>

    <!-- Bootstrap -->
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <!-- Font Awesome Icons -->
    <link crossorigin="anonymous" href="https://use.fontawesome.com/releases/v5.7.0/css/all.css"
        integrity="sha384-lZN37f5QGtY3VHgisS14W3ExzMWZxybE1SJSEsQp9S+oqd12jhcu+A56Ebc1zFSJ" rel="stylesheet">
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="user">
        <table class="user-table" id="userTable">
            <thead>
                <tr>
                    <th class="user-cell">Order</th>
                    <th class="user-cell">Customer</th>
                    <th class="user-cell">Date</th>
                    <th class="user-cell">Total</th>
                    <th class="user-cell">Status</th>
                    <th class="user-cell"></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="order : ${orders}">
                    <td class="user-cell" th:text="${order.id}"></td>
                    <td class="user-cell" th:text="${order.user.username}"></td>
                    <td class="user-cell" th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy, HH:mm')}"></td>
                    <td class="user-cell"
                        th:text="'€' + ${#numbers.formatDecimal(order.total, 0, 'COMMA', 2, 'POINT')}"></td>
                    <td class="user-cell" th:text="${order.status}"></td>
                    <td class="user-cell"><a th:href="@{/orders/{id}(id=${order.id})}">
                            <button class="user-button prd-btn btn btn-sm btn-success view-btn"
                                type="button">View</button>
                        </a></td>
                </tr>
            </tbody>
        </table>

    </div>

</body>

</html>
