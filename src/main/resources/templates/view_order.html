<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">

<head>
    <title>View Orders</title>
</head>

<body>
    <main>
        <div class="user">
            <nav th:if="${orders.totalPages > 1}" class="mt-3">
                <a th:if="${orders.hasPrevious()}" class="btn btn-sm btn-outline-success"
                    th:href="@{/view/orders(status=${status}, page=${orders.number - 1}, size=${orders.size})}">&laquo;
                    Previous</a>
                <span class="mx-2"
                    th:text="|Page ${orders.number + 1} of ${orders.totalPages} · ${orders.totalElements} orders|"></span>
                <a th:if="${orders.hasNext()}" class="btn btn-sm btn-outline-success"
                    th:href="@{/view/orders(status=${status}, page=${orders.number + 1}, size=${orders.size})}">Next
                    &raquo;</a>
            </nav>

            <div class="mb-3">
                <a th:href="@{/view/orders}" class="btn btn-sm"
                    th:classappend="${status == null} ? 'btn-success' : 'btn-outline-success'">All</a>
                <a th:each="s : ${statuses}" th:href="@{/view/orders(status=${s})}" th:text="${s}" class="btn btn-sm"
                    th:classappend="${s == status} ? 'btn-success' : 'btn-outline-success'"></a>
            </div>

            <p th:if="${orders.empty}">No orders here.</p>

            <table class="user-table" id="userTable">
                <thead>
                    <tr>
                        <th class="user-cell">Order</th>
                        <th class="user-cell">Customer</th>
                        <th class="user-cell">Date</th>
                        <th class="user-cell">Total</th>
                        <th class="user-cell">Status</th>
                        <th class="user-cell"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${orders}">
                        <td class="user-cell" th:text="${order.id}"></td>
                        <td class="user-cell" th:text="${order.user.username}"></td>
                        <td class="user-cell" th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy, HH:mm')}"></td>
                        <td class="user-cell"
                            th:text="'€' + ${#numbers.formatDecimal(order.total, 0, 'COMMA', 2, 'POINT')}"></td>
                        <td class="user-cell" th:text="${order.status}"></td>
                        <td class="user-cell"><a th:href="@{/orders/{id}(id=${order.id})}">
                                <button class="user-button prd-btn btn btn-sm btn-success view-btn"
                                    type="button">View</button>
                            </a></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>

</html>
