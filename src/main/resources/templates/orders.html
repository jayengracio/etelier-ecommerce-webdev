<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">

<head>
    <title>Order Details - Etelier</title>
</head>

<body>
    <main class="flex flex-col gap-6 md:gap-8">
        <div class="flex flex-col gap-3">
            <p class="text-eyebrow text-zinc-500 uppercase" th:text="|Customer · ${order.user.username}|"></p>
            <div class="flex flex-wrap items-center gap-4">
                <h1 class="mb-0" th:text="|Order #${order.id}|"></h1>
                <span th:replace="~{fragments/status-badge :: badge(${order.status})}"></span>
            </div>
        </div>

        <div th:if="${param.refunded}" class="alert alert-success mb-0" role="status">
            <span class="shrink-0"><svg th:replace="~{fragments/icons :: check-circle}"></svg></span>
            <p>Refunded in Stripe. Stock added back to shelf</p>
        </div>
        <div th:if="${param.refundError}" class="alert alert-danger mb-0" role="alert">
            <span class="shrink-0"><svg th:replace="~{fragments/icons :: exclamation-circle}"></svg></span>
            <p>Refund refused by Stripe. This order is unchanged. Check this order's refund status in Dashboard.</p>
        </div>

        <!--/* The items on the left; from lg up the facts and the actions sit in a panel on the right */-->
        <div class="grid items-start gap-6 lg:grid-cols-[minmax(0,1fr)_22.5rem] lg:gap-8">
            <div class="card overflow-x-auto p-0">
                <!--/* The unit price hides on phones, in every row (see checkout.html) */-->
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th class="text-right">Qty</th>
                            <th class="text-right max-sm:hidden">Price</th>
                            <th class="text-right">Subtotal</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="item : ${order.items}" th:with="product=${item.product}">
                            <td>
                                <div class="flex items-center gap-3">
                                    <div class="size-10 shrink-0 overflow-hidden rounded-lg border border-zinc-200">
                                        <div th:replace="~{fragments/product-picture :: picture(${product}, 'aspect-square w-full', 'size-5')}"></div>
                                    </div>
                                    <span th:text="${product.name}"></span>
                                </div>
                            </td>
                            <td class="text-right tabular-nums" th:text="${item.quantity}"></td>
                            <td class="text-right whitespace-nowrap tabular-nums max-sm:hidden"
                                th:text="'€' + ${#numbers.formatDecimal(item.unitPrice, 1, 'COMMA', 2, 'POINT')}"></td>
                            <td class="text-right whitespace-nowrap tabular-nums"
                                th:text="'€' + ${#numbers.formatDecimal(item.lineTotal, 1, 'COMMA', 2, 'POINT')}"></td>
                        </tr>
                    </tbody>

                    <tfoot>
                        <tr>
                            <td>Total</td>
                            <td></td>
                            <td class="max-sm:hidden"></td>
                            <td class="text-right whitespace-nowrap tabular-nums"
                                th:text="'€' + ${#numbers.formatDecimal(order.total, 1, 'COMMA', 2, 'POINT')}"></td>
                        </tr>
                    </tfoot>
                </table>
            </div>

            <div class="card flex flex-col gap-5 sm:p-6">
                <!--/* A definition list: each label (dt) with its value (dd), two columns */-->
                <dl class="grid grid-cols-[auto_minmax(0,1fr)] gap-x-4 gap-y-2.5 text-caption">
                    <dt class="text-zinc-500">Placed</dt>
                    <dd>
                        <time th:datetime="${order.createdAt}"
                            th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy, HH:mm')}"></time>
                    </dd>
                    <dt class="text-zinc-500">Customer</dt>
                    <dd th:text="${order.user.username}"></dd>
                    <th:block th:if="${order.stripeSessionId}">
                        <dt class="text-zinc-500">Stripe session</dt>
                        <!--/* break-all: the session id is one long word and would widen the panel */-->
                        <dd class="font-mono text-xs/normal font-regular break-all" th:text="${order.stripeSessionId}"></dd>
                    </th:block>
                </dl>
                <a th:if="${order.stripePaymentIntentId}" class="link self-start text-caption"
                    th:href="|https://dashboard.stripe.com/test/payments/${order.stripePaymentIntentId}|" target="_blank"
                    rel="noopener">View payment in Stripe</a>

                <!--/* Refund is an outline-danger pill, a step below Mark as shipped: it shouldn't look like the
                       obvious next action. A 2px rule separates the actions from the facts. */-->
                <div th:if="${order.shippable or order.refundable}"
                    class="flex flex-col gap-2 border-t-2 border-zinc-300 pt-5">
                    <form th:if="${order.shippable}" th:action="@{/orders/{id}/ship(id=${order.id})}" method="post">
                        <button class="btn btn-primary w-full" type="submit">Mark as shipped</button>
                    </form>
                    <form th:if="${order.refundable}" th:action="@{/orders/{id}/refund(id=${order.id})}" method="post"
                        onsubmit="return confirm('Refund this order?');">
                        <button class="btn btn-outline-danger w-full" type="submit">Refund</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
