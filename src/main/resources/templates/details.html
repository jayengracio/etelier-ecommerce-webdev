<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">

<head>
    <title>Product Details - Etelier</title>
</head>

<body>
    <main class="flex flex-col gap-6 md:gap-8">
        <div class="flex items-center gap-3">
            <!--/* Back to the list. The .tooltip is its name for screen readers and shows on hover/focus
                   (it needs "group" on the link). left-0 translate-x-0 start the tooltip at the button
                   instead of centring it, so it can't stick out past the page's left edge on phones. */-->
            <a class="icon-btn group" th:href="@{/products}">
                <svg th:replace="~{fragments/icons :: arrow-left(iconSize='size-5')}"></svg>
                <span class="tooltip left-0 translate-x-0">Back to products</span>
            </a>
            <p class="text-caption text-zinc-500 max-sm:hidden" th:text="|Products / ${product.type}|"></p>
        </div>

        <!--/* One column on phones; from md up the picture takes 7 of 12 columns and the text the other 5. */-->
        <div class="grid items-start gap-6 md:grid-cols-12 md:gap-10 lg:gap-14">
            <div class="overflow-hidden rounded-frame border-2 border-zinc-300 bg-white p-6 md:col-span-7 md:p-10">
                <div th:replace="~{fragments/product-picture :: picture(${product}, 'aspect-square w-full', 'size-16')}"></div>
            </div>

            <div class="flex flex-col gap-6 md:col-span-5 md:pt-6">
                <div class="flex flex-col items-start gap-3 md:gap-4">
                    <span class="rounded-full bg-meadow px-3 py-1 text-eyebrow uppercase" th:text="${product.type}"></span>
                    <h1 class="mb-0 text-heading-xl lg:text-display-md" th:text="${product.name}"></h1>
                </div>

                <div class="flex flex-wrap items-center gap-3">
                    <p class="font-display text-heading-lg tabular-nums md:text-heading-xl"
                        th:text="'€' + ${#numbers.formatDecimal(product.price, 1, 'COMMA', 2, 'POINT')}"></p>
                    <span class="badge badge-danger" th:if="${product.stock == 0}">Out of stock</span>
                    <span class="badge badge-warning" th:if="${product.stock > 0 and product.stock <= lowStockThreshold}"
                        th:text="|Only ${product.stock} left|"></span>
                </div>

                <p class="text-pretty text-zinc-600" th:text="${product.details}"></p>

                <!--/* Below md the buttons are a bar pinned to the bottom of the screen, always in thumb
                       reach. It is h-20 tall: the layout's <body> gets that much bottom padding when
                       #product-actions is on the page (so the bar never covers the footer), and the
                       cart toast moves up above it (cart-toast.html). */-->
                <div id="product-actions"
                    class="flex gap-2 md:pt-2 max-md:fixed max-md:inset-x-0 max-md:bottom-0 max-md:z-10 max-md:h-20 max-md:items-center max-md:border-t max-md:border-zinc-200 max-md:bg-white max-md:px-6">
                    <form class="flex-1" th:action="@{/cart/add/{id}(id=${product.id})}" method="post" data-add-to-cart
                        th:data-name="${product.name}" th:data-image="${product.image} ? @{${product.image}}">
                        <button class="btn btn-lg btn-outline w-full" type="submit"
                            th:disabled="${product.stock == 0}">Add To Cart</button>
                    </form>
                    <form class="flex-1" th:action="@{/cart/buy/{id}(id=${product.id})}" method="post">
                        <button class="btn btn-lg btn-primary w-full" type="submit"
                            th:disabled="${product.stock == 0}">Buy</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
