<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">

<head>
    <title>Product Details</title>
</head>

<body>
    <main class="mx-auto max-w-3xl">
        <h1 th:text="'Details for: ' + ${product.name}">Details for: </h1>

        <div class="card grid gap-6 md:grid-cols-2">
            <img class="w-full rounded-md object-contain" th:src="@{${'/images/' + product.name + '.png'}}"
                alt="Product Image">

            <div>
                <dl class="space-y-3 text-sm">
                    <div>
                        <dt class="font-medium text-stone-500">ID</dt>
                        <dd th:text="${product.id}"></dd>
                    </div>
                    <div>
                        <dt class="font-medium text-stone-500">Type</dt>
                        <dd th:text="${product.type}"></dd>
                    </div>
                    <div>
                        <dt class="font-medium text-stone-500">Price</dt>
                        <dd th:text="'€' + ${#numbers.formatDecimal(product.price, 0, 'COMMA', 2, 'POINT')}"></dd>
                    </div>
                    <div>
                        <dt class="font-medium text-stone-500">Details</dt>
                        <dd th:text="${product.details}"></dd>
                    </div>
                </dl>

                <div class="mt-6 flex gap-2">
                    <form th:action="@{/cart/add/{id}(id=${product.id})}" method="post" data-add-to-cart
                        th:data-name="${product.name}" th:data-image="@{${'/images/' + product.name + '.png'}}">
                        <button class="btn btn-primary" type="submit">Add To Cart</button>
                    </form>
                    <a class="btn btn-secondary" href="/products">Go Back</a>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
