            </div>

                </form>

                <a href="/view/orders">
                    <button class="login-btn btn btn-success btn-block" type="submit">View
                        Orders
                    </button>
                </a>
                <a href="/">
                    <button class="login-btn btn btn-success btn-block" type="submit">Change Orders</button>

            </div>

        <div class="owners-form">
            <form class="was-validated" onsubmit="addProduct(event)">
                <div class="form-group">
                    <label class="owner-label" for="name">Type:</label>
                    <input class="form-control" id="type" name="type" type="text" required><br><br>
                </div>

                <div class="form-group">
                    <label class="owner-label" for="name">Name:</label>
                    <input class="form-control" id="name" name="name" type="text" required><br><br>
                </div>

                <div class="form-group">
                    <label class="owner-label" for="price">Price:</label>
                    <input class="form-control" id="price" name="price" type="number" step="0.01" min="0"
                        required><br><br>
                </div>

                <div class="form-group">
                    <label class="owner-label" for="details">Details:</label>
                    <input class="form-control" id="details" name="details" type="text" required><br><br>
                </div>

                <div class="form-group">
                    <label class="owner-label" for="stock">Stock:</label>
                    <input class="form-control" id="stock" name="stock" type="number" min="0" required><br><br>
                </div>

                <div class="log-btns text-center">
                    <button class="owner-btn btn btn-success btn-block" type="submit">Add Product</button>
                </div>
            </form>
        </div>

    </div>
