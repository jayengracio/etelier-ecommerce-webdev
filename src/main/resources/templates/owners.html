<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <link rel="shortcut icon" type="image/png" href="/images/logo.png">
    <title>Owner Page</title>
    <meta charset="utf-8">

    <link href="style.css" rel="stylesheet" type="text/css">
    <script src="code.js" type="text/javascript"></script>

    <!-- Bootstrap -->
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <!-- Font Awesome Icons -->
    <link crossorigin="anonymous" href="https://use.fontawesome.com/releases/v5.7.0/css/all.css"
        integrity="sha384-lZN37f5QGtY3VHgisS14W3ExzMWZxybE1SJSEsQp9S+oqd12jhcu+A56Ebc1zFSJ" rel="stylesheet">
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="main-container" style="width: 75%; margin: auto;">

        <div class="profile-card">
            <div class="container">
                <h4><b th:text="'Welcome, ' + ${#authentication.name} + '!'"></b></h4>
            </div>
            <div class="log-btns text-center">
                <form th:action="@{/logout}" method="post">
                    <button class="login-btn btn btn-success btn-block" type="submit">Log Out</button>
                </form>

                <a href="/view/orders">
                    <button class="login-btn btn btn-success btn-block" type="button">View
                        Orders
                    </button>
                </a>
            </div>
        </div>

        <div class="dashboard my-4">
            <h2>Dashboard</h2>

            <div class="row text-center">
                <div class="col-md-4 mb-3">
                    <div class="card h-100">
                        <div class="card-body">
                            <h6 class="card-subtitle text-muted mb-2">Revenue, all time</h6>
                            <h3
                                th:text="'€' + ${#numbers.formatDecimal(stats.allTime.revenue, 1, 'COMMA', 2, 'POINT')}">
                                €0.00</h3>
                            <small th:text="${stats.allTime.orders} + ' paid or shipped orders'"></small>
                        </div>
                    </div>
                </div>

                <div class="col-md-4 mb-3">
                    <div class="card h-100">
                        <div class="card-body">
                            <h6 class="card-subtitle text-muted mb-2">Revenue, last 7 days</h6>
                            <h3
                                th:text="'€' + ${#numbers.formatDecimal(stats.lastSevenDays.revenue, 1, 'COMMA', 2, 'POINT')}">
                                €0.00</h3>
                            <small th:text="${stats.lastSevenDays.orders} + ' paid or shipped orders'"></small>
                        </div>
                    </div>
                </div>

                <div class="col-md-4 mb-3">
                    <div class="card h-100">
                        <div class="card-body">
                            <h6 class="card-subtitle text-muted mb-2">Orders by status</h6>
                            <ul class="list-unstyled mb-0">
                                <li th:each="entry : ${stats.ordersByStatus}">
                                    <a th:href="@{/view/orders(status=${entry.key})}" th:text="${entry.key}"></a>
                                    <b th:text="${entry.value}"></b>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <h4 class="mt-3">Recent orders</h4>
            <p th:if="${#lists.isEmpty(stats.recentOrders)}">No orders yet.</p>
            <table class="user-table" th:unless="${#lists.isEmpty(stats.recentOrders)}">
                <thead>
                    <tr>
                        <th class="user-cell">Order</th>
                        <th class="user-cell">Customer</th>
                        <th class="user-cell">Date</th>
                        <th class="user-cell">Total</th>
                        <th class="user-cell">Status</th>
                        <th class="user-cell"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${stats.recentOrders}">
                        <td class="user-cell" th:text="${order.id}"></td>
                        <td class="user-cell" th:text="${order.user.username}"></td>
                        <td class="user-cell" th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy, HH:mm')}">
                        </td>
                        <td class="user-cell"
                            th:text="'€' + ${#numbers.formatDecimal(order.total, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td class="user-cell" th:text="${order.status}"></td>
                        <td class="user-cell"><a th:href="@{/orders/{id}(id=${order.id})}">
                                <button class="prd-btn btn btn-sm btn-success" type="button">View</button>
                            </a></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="owners-form">
            <form class="was-validated" onsubmit="addProduct(event)">
                <div class="form-group">
                    <label class="owner-label" for="name">Type:</label>
                    <input class="form-control" id="type" name="type" type="text" required><br><br>
                </div>

                <div class="form-group">
                    <label class="owner-label" for="name">Name:</label>
                    <input class="form-control" id="name" name="name" type="text" required><br><br>
                </div>

                <div class="form-group">
                    <label class="owner-label" for="price">Price:</label>
                    <input class="form-control" id="price" name="price" type="number" step="0.01" min="0"
                        required><br><br>
                </div>

                <div class="form-group">
                    <label class="owner-label" for="details">Details:</label>
                    <input class="form-control" id="details" name="details" type="text" required><br><br>
                </div>

                <div class="form-group">
                    <label class="owner-label" for="stock">Stock:</label>
                    <input class="form-control" id="stock" name="stock" type="number" min="0" required><br><br>
                </div>

                <div class="log-btns text-center">
                    <button class="owner-btn btn btn-success btn-block" type="submit">Add Product</button>
                </div>
            </form>
        </div>

    </div>
</body>

</html>
