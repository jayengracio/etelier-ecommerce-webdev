<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">

<head>
    <title>Owner Dashboard</title>
</head>

<body>
    <main class="space-y-8">
        <div class="flex flex-wrap items-center justify-between gap-4">
            <h1 class="mb-0" th:text="'Hello, ' + ${#authentication.name}"></h1>
            <div class="flex gap-2">
                <a class="btn btn-primary" href="/view/orders">View Orders</a>
                <form th:action="@{/logout}" method="post">
                    <button class="btn btn-secondary" type="submit">Log Out</button>
                </form>
            </div>
        </div>

        <section>
            <h2>Dashboard</h2>
            <div class="grid gap-4 text-center md:grid-cols-3">
                <div class="card">
                    <h3 class="text-sm font-medium text-stone-500">All time revenue</h3>
                    <p class="text-2xl font-bold"
                        th:text="'$' + ${#numbers.formatDecimal(stats.allTime.revenue, 1, 'COMMA', 2, 'POINT')}">$0.00
                    </p>
                    <p class="text-sm text-stone-500" th:text="${stats.allTime.orders} + ' paid or shipped orders'"></p>
                </div>

                <div class="card">
                    <h3 class="text-sm font-medium text-stone-500">Revenue, last 7 days</h3>
                    <p class="text-2xl font-bold"
                        th:text="'€' + ${#numbers.formatDecimal(stats.lastSevenDays.revenue, 1, 'COMMA', 2, 'POINT')}">
                        $0.00</p>
                    <p class="text-sm text-stone-500"
                        th:text="${stats.lastSevenDays.orders} + ' paid or shipped orders'"> </p>
                </div>

                <div class="card">
                    <h3 class="text-sm font-medium text-stone-500">Orders by status</h3>
                    <ul class="space-y-1 text-sm">
                        <li th:each="entry : ${stats.ordersByStatus}">
                            <a class="link" th:href="@{/view/orders(status=${entry.key})}" th:text="${entry.key}"></a>
                            <b th:text="${entry.value}"></b>
                        </li>
                    </ul>
                </div>
            </div>
        </section>

        <section>
            <h2>Low stock
                <small class="text-base font-normal text-stone-500"
                    th:text="|(${stats.lowStockThreshold} or fewer left)|"></small>
            </h2>
            <p class="text-stone-500" th:if="${#lists.isEmpty(stats.lowStock)}">Inventory is well stocked.</p>
            <ul class="card divide-y divide-stone-200 p-0" th:unless="${#lists.isEmpty(stats.lowStock)}">
                <li class="flex items-center justify-between gap-4 px-4 py-3" th:each="product : ${stats.lowStock}">
                    <a class="link" th:href="@{/edit/{id}(id=${product.id})}" th:text="${product.name}"></a>
                    <span class="badge" th:classappend="${product.stock == 0} ? 'badge-danger' : 'badge-warning'"
                        th:text="${product.stock == 0} ? 'Out of stock' : |${product.stock} left|"></span>
                </li>
            </ul>
        </section>

        <section>
            <h2>Recent orders</h2>
            <p class="text-stone-500" th:if="${#lists.isEmpty(stats.recentOrders)}">No orders yet.</p>
            <div class="card overflow-x-auto p-0" th:unless="${#lists.isEmpty(stats.recentOrders)}">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Order</th>
                            <th>Customer</th>
                            <th>Date</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th><span class="sr-only">Actions</span></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="order : ${stats.recentOrders}">
                            <td th:text="${order.id}"></td>
                            <td th:text="${order.user.username}"></td>
                            <td class="whitespace-nowrap"
                                th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy, HH:mm')}"></td>
                            <td th:text="'€' + ${#numbers.formatDecimal(order.total, 1, 'COMMA', 2, 'POINT')}"></td>
                            <td th:text="${order.status}"></td>
                            <td class="text-right">
                                <a class="btn btn-secondary btn-sm" th:href="@{/orders/{id}(id=${order.id})}">View</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!--/* code.js's addProduct() reads these ids: type, name, price, details, stock. */-->
        <section class="card max-w-xl">
            <h2>Add a product</h2>
            <form class="space-y-4" onsubmit="addProduct(event)">
                <div>
                    <label class="label" for="type">Type</label>
                    <input class="input" id="type" name="type" type="text" maxlength="50" required>
                </div>

                <div>
                    <label class="label" for="name">Name</label>
                    <input class="input" id="name" name="name" type="text" maxlength="255" required>
                </div>

                <div class="grid gap-4 sm:grid-cols-2">
                    <div>
                        <label class="label" for="price">Price</label>
                        <input class="input" id="price" name="price" type="number" step="0.01" min="0" required>
                    </div>

                    <div>
                        <label class="label" for="stock">Stock</label>
                        <input class="input" id="stock" name="stock" type="number" min="0" required>
                    </div>
                </div>

                <div>
                    <label class="label" for="details">Details</label>
                    <input class="input" id="details" name="details" type="text" maxlength="1000" required>
                </div>

                <button class="btn btn-primary w-full" type="submit">Add Product</button>
            </form>
        </section>
    </main>
</body>

</html>
