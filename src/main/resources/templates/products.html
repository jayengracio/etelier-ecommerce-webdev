<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">

<head>
    <title>View Products</title>
</head>

<body>
    <main>
        <h1>Products</h1>
        <div class="mb-4 grid gap-3 sm:grid-cols-2">
            <input class="input" id="searchType" onkeyup="filterByType()" placeholder="Search by type..." type="text">
            <input class="input" id="searchName" onkeyup="filterByName()" placeholder="Search by name..." type="text">
        </div>

        <div class="card overflow-x-auto p-0">
            <table class="data-table" id="productTable">
                <thead>
                    <tr>
                        <th>Type</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th><span class="sr-only">Actions</span></th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="product : ${products}" th:id="|row_${product.id}|">
                        <td th:text="${product.type}"></td>
                        <td th:text="${product.name}"></td>
                        <td th:text="'€' + ${#numbers.formatDecimal(product.price, 0, 'COMMA', 2, 'POINT')}"></td>
                        <td th:text="${product.stock}"></td>
                        <td>
                            <div class="flex justify-end gap-2">
                                <a class="btn btn-secondary btn-sm"
                                    th:href="@{/details/{id}(id=${product.id})}">Details</a>
                                <form th:action="@{/cart/add/{id}(id=${product.id})}" method="post" data-add-to-cart
                                    th:data-name="${product.name}"
                                    th:data-image="@{${'/images/' + product.name + '.png'}}">
                                    <button class="btn btn-primary btn-sm whitespace-nowrap" type="submit">Add
                                        To
                                        Cart</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>

</html>
