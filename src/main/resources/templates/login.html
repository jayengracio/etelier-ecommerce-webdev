<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">

<head>
    <title>Login</title>
</head>

<body>
    <main class="mx-auto max-w-sm">
        <div class="card">
            <h2>Login</h2>
            <div class="alert alert-danger" th:if="${param.error}">Wrong username or password.</div>
            <div class="alert alert-info" th:if="${param.logout}">You've been logged out.</div>
            <div class="alert alert-success" th:if="${param.registered}">Account created, please log in.</div>
            <form class="space-y-4" th:action="@{/login}" method="POST">
                <input class="input" id="username" name="username" placeholder="Username" type="text">
                <input class="input" id="pass" name="password" placeholder="Password" type="password">
                <div class="space-y-2 pt-2">
                    <button class="btn btn-primary w-full" type="submit">Log In</button>
                    <a class="btn btn-secondary w-full" href="/register">Register</a>
                </div>
            </form>
        </div>
    </main>

</body>

</html>
