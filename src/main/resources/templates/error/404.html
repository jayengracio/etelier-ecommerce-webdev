<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">

<head>
    <title>Not Found - Etelier</title>
</head>

<body>
    <!--/* Spring Boot renders this page itself (not MainController), so there's no cartCount or
           currentPath here; path is one of Spring Boot's error attributes: the URL that wasn't found. */-->
    <main class="flex flex-col items-center gap-6 py-12 text-center">
        <p class="font-display text-display-xl" aria-hidden="true">404</p>
        <div class="flex flex-col items-center gap-3">
            <h1 class="mb-0 text-heading-xl">Something went wrong.</h1>
            <code class="rounded-full bg-zinc-100 px-3 py-1 font-mono text-micro font-regular break-all text-zinc-600"
                th:if="${path}" th:text="${path}"></code>
        </div>
        <a class="btn btn-primary" href="/products">Go back to shop</a>
    </main>
</body>

</html>
