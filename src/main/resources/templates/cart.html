<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">

<head>
    <title>Your Cart</title>
</head>

<body>
    <main>
        <h1 th:text="'Checkout Cart: ' + ${#authentication.name}">Cart for: </h1>

        <div th:if="${param.outOfStock}" class="alert alert-danger">
            Some items in your cart are out of stock or no longer being sold. Remove them from your cart or try again later.
        </div>

        <div class="card overflow-x-auto p-0">
            <table class="data-table" id="cartTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Qty</th>
                        <th>Subtotal</th>
                        <th><span class="sr-only">Actions</span></th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="item : ${items}">
                        <td th:text="${item.product.id}"></td>
                        <td th:text="${item.product.name}"></td>
                        <td th:text="'€' + ${#numbers.formatDecimal(item.product.price, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td>
                            <span th:text="${item.quantity}"></span>
                            <small class="block text-red-700" th:if="${item.quantity > item.product.stock}"
                                th:text="|Only ${item.product.stock} left|"></small>
                            <small class="block text-red-700" th:unless="${item.product.active}">No longer sold. Please remove from your cart.</small>
                        </td>
                        <td th:text="'€' + ${#numbers.formatDecimal(item.lineTotal, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td>
                            <div class="flex justify-end gap-2">
                                <a class="btn btn-secondary btn-sm" th:href="@{/details/{id}(id=${item.product.id})}">Details</a>
                                <button class="btn btn-secondary btn-sm" th:onclick="|removeProduct(${item.product.id})|"
                                    type="button">Remove</button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="mt-6 flex justify-end">
            <a class="btn btn-primary" href="/checkout">Proceed to Checkout</a>
        </div>
    </main>

</body>

</html>
