<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">

<head>
    <title>Checkout</title>
</head>

<body>
    <main class="grid items-start gap-6 lg:grid-cols-3">
        <div class="card lg:col-span-2">
            <div th:if="${param.cancelled}" class="alert alert-warning">
                Payment cancelled. Your cart is still here
            </div>
            <div th:if="${param.paymentError}" class="alert alert-danger">
                We couldn't reach the payment provider. Please try again
            </div>

            <form th:action="@{/purchase}" method="post">
                <p class="mb-4">You will be taken to Stripe's secure checkout</p>
                <button class="btn btn-primary w-full" type="submit">Pay with Stripe</button>
            </form>
        </div>

        <div class="card overflow-x-auto p-0">
            <table class="data-table" id="cartTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Qty</th>
                        <th>Subtotal</th>
                        <th><span class="sr-only">Actions</span></th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="item : ${items}">
                        <td th:text="${item.product.name}"></td>
                        <td th:text="${item.quantity}"></td>
                        <td th:text="'€' + ${#numbers.formatDecimal(item.lineTotal, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td>
                            <button class="btn btn-secondary btn-sm" th:onclick="|removeProduct(${item.product.id})|"
                                type="button">Remove</button>
                        </td>
                    </tr>

                    <tr>
                        <td class="text-right text-lg font-bold" colspan="4"
                            th:text="'Total: €' + ${#numbers.formatDecimal(total, 1, 'COMMA', 2, 'POINT')}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>

</html>
