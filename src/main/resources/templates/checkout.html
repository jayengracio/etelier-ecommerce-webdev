<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <link rel="shortcut icon" type="image/png" href="/images/logo.png">
    <meta charset="UTF-8">
    <title>Checkout</title>
    <link href="style.css" rel="stylesheet" type="text/css">
    <script src="code.js" type="text/javascript"></script>

    <!-- Bootstrap -->
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <!-- Font Awesome Icons -->
    <link crossorigin="anonymous" href="https://use.fontawesome.com/releases/v5.7.0/css/all.css"
        integrity="sha384-lZN37f5QGtY3VHgisS14W3ExzMWZxybE1SJSEsQp9S+oqd12jhcu+A56Ebc1zFSJ" rel="stylesheet">
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-75">
                <div class="ckout-container">
                    <div th:if="${param.cancelled}" class="alert alert-warning">
                        Payment cancelled. Your cart is still here
                    </div>
                    <div th:if="${param.paymentError}" class="alert alert-danger">
                        We couldn't reach the payment provider. Please try again
                    </div>

                    <form th:action="@{/purchase}" method="post">
                        <p> You will be taken to Stripe's secure checkout</p>
                        <input class="ckout-btn btn btn-success btn-block" type="submit" value="Pay with Stripe">
                    </form>
                </div>
            </div>

            <div class="col-25">
                <div class="ckout-container">
                    <table class="cart-table" id="cartTable">
                        <thead>
                            <tr>
                                <th class="cart-cell" style="width: auto">Name</th>
                                <th class="cart-cell" style="width: 50px">Qty</th>
                                <th class="cart-cell" style="width: auto">Subtotal</th>
                                <th class="cart-cell" style="width: 80px"></th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="item : ${items}">
                                <td class="cart-cell" th:text="${item.product.name}"></td>
                                <td class="cart-cell" th:text="${item.quantity}"></td>
                                <td class="cart-cell"
                                    th:text="'€' + ${#numbers.formatDecimal(item.lineTotal, 0, 'COMMA', 2, 'POINT')}">
                                </td>
                                <td class="cart-cell">
                                    <button class="btn btn-sm btn-success btn-block ckout-btn"
                                        th:onclick="|removeProduct(${item.product.id})|" type="button">Remove</button>
                                </td>
                            </tr>

                            <tr>
                                <td class="total-cell" colspan="4"
                                    th:text="'Total: €' + ${#numbers.formatDecimal(total, 0, 'COMMA', 2, 'POINT')}">
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
