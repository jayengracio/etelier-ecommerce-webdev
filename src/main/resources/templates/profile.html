<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">

<head>
    <title>Your Profile - Etelier</title>
</head>

<body>
    <main class="grid items-start gap-8 md:grid-cols-[16rem_1fr]">
        <div class="card text-center">
            <img alt="Avatar" class="mx-auto mb-4 size-32 rounded-full" src="/images/img_avatar.png">
            <h3 th:text="'Welcome, ' + ${#authentication.name} + '!'"></h3>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-primary w-full" type="submit">Log Out</button>
            </form>
        </div>

        <div>
            <h1>Your order history</h1>
            <p class="text-stone-500" th:if="${orders.isEmpty()}">You haven't ordered anything yet.</p>

            <div class="card mb-6 overflow-x-auto p-0" th:each="order : ${orders}">
                <h3 class="px-4 pt-4 text-base">
                    Order #<span th:text="${order.id}"></span>
                    · <span th:text="${#temporals.format(order.createdAt, 'dd MM yyyy, HH:mm')}"></span>
                    · <span th:text="${order.status}"></span>
                </h3>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Qty</th>
                            <th>Price</th>
                            <th>Subtotal</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${order.items}">
                            <td th:text="${item.product.name}"></td>
                            <td th:text="${item.quantity}"></td>
                            <td th:text="'€' + ${#numbers.formatDecimal(item.unitPrice, 1, 'COMMA', 2, 'POINT')}"></td>
                            <td th:text="'€' + ${#numbers.formatDecimal(item.lineTotal, 1, 'COMMA', 2, 'POINT')}"></td>
                        </tr>
                        <tr>
                            <td class="text-right font-bold" colspan="4"
                                th:text="'Total: €' + ${#numbers.formatDecimal(order.total, 1, 'COMMA', 2, 'POINT')}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

</body>

</html>
