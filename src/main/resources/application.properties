server.port=3000

# Session id only in the cookie, never in URLs: a ;jsessionid=... link is refused by
# Spring Security (400) and would leak the session through history, logs and Referer.
server.servlet.session.tracking-modes=cookie

spring.datasource.url=jdbc:postgresql://localhost:5432/shop
spring.datasource.username=shop
spring.datasource.password=${DB_PASSWORD:devpassword}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
app.base-url=${APP_BASE_URL:http://localhost:3000}
app.low-stock-threshold=13
